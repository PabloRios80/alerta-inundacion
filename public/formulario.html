<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Relevamiento Sanitario - Colastiné Norte</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; max-width: 650px; margin: 0 auto; padding: 15px; background: #eef2f7; color: #212529; }
    .card { background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); border-top: 4px solid #0d47a1; }
    h2 { margin-top: 0; color: #0d47a1; border-bottom: 2px solid #e9ecef; padding-bottom: 10px; }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    @media (max-width: 500px) { .grid-2 { grid-template-columns: 1fr; } }
    label { display: block; margin-top: 14px; font-weight: 600; font-size: 0.9rem; color: #333; }
    input[type="text"], input[type="number"], input[type="tel"], textarea, select {
      width: 100%; padding: 10px; margin-top: 5px; border: 1px solid #ccd0d5; border-radius: 6px; box-sizing: border-box; font-size: 1rem;
    }
    .alerta-box { background: #fff3cd; border: 1px solid #ffeeba; padding: 12px; border-radius: 6px; margin-top: 14px; display: flex; align-items: center; gap: 10px; }
    .alerta-box input { width: 20px; height: 20px; margin: 0; }
    #map { height: 260px; margin-top: 10px; border-radius: 6px; border: 1px solid #ccc; }
    .btn-gps { background: #198754; color: white; border: none; padding: 10px; border-radius: 6px; width: 100%; font-weight: bold; margin-top: 8px; cursor: pointer; }
    .btn-submit { width: 100%; padding: 14px; background: #0d47a1; color: white; border: none; border-radius: 6px; font-size: 1.05rem; font-weight: bold; margin-top: 22px; cursor: pointer; }
    .btn-submit:hover { background: #0a3575; }
    .back-link { display: inline-block; margin-bottom: 15px; color: #0d47a1; text-decoration: none; font-weight: 600; }
    .back-link:hover { text-decoration: underline; }
  </style>
</head>
<body>
  <div class="card">
    <a href="index.html" class="back-link">← Volver al inicio</a>
    <h2>Ficha de Relevamiento - Riesgo Hídrico</h2>
    <form id="formRiesgo">
      <div style="background: #e8f0fe; padding: 12px; border-radius: 6px; margin-bottom: 15px; border: 1px solid #b6d4fe;">
        <label style="margin-top: 0; color: #084298;">👤 Operador/a o Vecino/a que carga el dato *</label>
        <input type="text" id="operadora" required placeholder="Tu nombre y apellido">
      </div>
      <div class="grid-2">
        <div>
          <label>Apellido *</label>
          <input type="text" id="apellido" required placeholder="Ej: Pérez">
        </div>
        <div>
          <label>Nombre *</label>
          <input type="text" id="nombre" required placeholder="Ej: Juan Carlos">
        </div>
      </div>

      <div class="grid-2">
        <div>
          <label>DNI (sin puntos) *</label>
          <input type="number" id="dni" required placeholder="Ej: 25123456">
        </div>
        <div>
          <label>Teléfono / WhatsApp *</label>
          <input type="tel" id="telefono" required placeholder="Ej: 5493425123456">
        </div>
      </div>

      <label>Dirección o Referencia de Ubicación *</label>
      <input type="text" id="direccion_referencia" required placeholder="Ej: Pasaje s/n a 50m del terraplén">

      <label>Enfermedad o Discapacidad que posee</label>
      <textarea id="enfermedad_discapacidad" rows="2" placeholder="Ej: Diabetes insulinodependiente, EPOC, discapacidad motriz..."></textarea>

      <label>Médico de cabecera o Centro de Salud de referencia</label>
      <input type="text" id="medico_centro_salud" placeholder="Ej: CAPS Colastiné / Dr. Gómez">

      <label>Medicación que toma habitualmente</label>
      <textarea id="medicacion" rows="2" placeholder="Ej: Insulina NPH, Enalapril 10mg..."></textarea>

      <div class="alerta-box">
        <input type="checkbox" id="es_electrodependiente">
        <label for="es_electrodependiente" style="margin:0; cursor:pointer; color:#856404;">
          ⚡ Paciente Electrodependiente (Requiere suministro eléctrico continuo)
        </label>
      </div>

      <label>Otras Observaciones (prótesis, retraso madurativo, postrado, etc.)</label>
      <textarea id="otras_observaciones" rows="2" placeholder="Ej: Usa silla de ruedas, vive solo..."></textarea>

      <label>Prioridad de Evacuación / Asistencia</label>
      <select id="criticidad">
        <option value="baja">Baja (Autoválido / Sin medicación crítica)</option>
        <option value="media" selected>Media (Requiere seguimiento o medicación crónica)</option>
        <option value="alta">ALTA (Electrodependiente / Movilidad reducida / Riesgo vital)</option>
      </select>

      <label>Geolocalización Exacta (Toca el botón GPS o arrastra el pin en el mapa)</label>
      <button type="button" class="btn-gps" onclick="obtenerGPS()">📍 Capturar mi ubicación GPS actual</button>
      <div id="map"></div>
      <input type="hidden" id="lat" required>
      <input type="hidden" id="lng" required>

      <button type="submit" class="btn-submit">Guardar Ficha en el Sistema</button>
    </form>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script>
    const defaultLat = -31.6333;
    const defaultLng = -60.7000;

    const map = L.map('map').setView([defaultLat, defaultLng], 13);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);

    let marker = L.marker([defaultLat, defaultLng], { draggable: true }).addTo(map);
    actualizarCoords(defaultLat, defaultLng);

    marker.on('dragend', () => {
      const pos = marker.getLatLng();
      actualizarCoords(pos.lat, pos.lng);
    });

    map.on('click', (e) => {
      marker.setLatLng(e.latlng);
      actualizarCoords(e.latlng.lat, e.latlng.lng);
    });

    function actualizarCoords(lat, lng) {
      const latNum = Number(lat);
      const lngNum = Number(lng);
      document.getElementById('lat').value = Number.isFinite(latNum) ? latNum : defaultLat;
      document.getElementById('lng').value = Number.isFinite(lngNum) ? lngNum : defaultLng;
    }

    function obtenerGPS() {
      if (!("geolocation" in navigator)) {
        alert("Este dispositivo no soporta GPS. Toca el mapa para marcar la ubicación.");
        return;
      }

      const btnGps = document.querySelector('.btn-gps');
      const textoOriginal = btnGps ? btnGps.textContent : '';
      if (btnGps) {
        btnGps.disabled = true;
        btnGps.textContent = "⏳ Buscando ubicación GPS...";
      }

      navigator.geolocation.getCurrentPosition(
        (pos) => {
          const { latitude, longitude } = pos.coords;
          map.setView([latitude, longitude], 17);
          marker.setLatLng([latitude, longitude]);
          actualizarCoords(latitude, longitude);
          if (btnGps) {
            btnGps.disabled = false;
            btnGps.textContent = textoOriginal;
          }
        },
        (err) => {
          if (btnGps) {
            btnGps.disabled = false;
            btnGps.textContent = textoOriginal;
          }
          alert("No se pudo obtener el GPS (" + err.message + "). Marca el punto tocando el mapa.");
        },
        {
          enableHighAccuracy: true,
          timeout: 10000,
          maximumAge: 30000
        }
      );
    }

    const electroCheck = document.getElementById('es_electrodependiente');
    if (electroCheck) {
      electroCheck.addEventListener('change', (e) => {
        if (e.target.checked && document.getElementById('criticidad')) {
          document.getElementById('criticidad').value = 'alta';
        }
      });
    }

    document.addEventListener('DOMContentLoaded', async () => {
      const opGuardada = localStorage.getItem('nombre_operadora');
      if (opGuardada && document.getElementById('operadora')) {
        document.getElementById('operadora').value = opGuardada;
      }

      const params = new URLSearchParams(window.location.search);
      const dniEditar = params.get('dni');

      if (!dniEditar) return;

      try {
        const res = await fetch(`/api/personas/${encodeURIComponent(dniEditar)}`);
        if (!res.ok) {
          alert('No se pudo encontrar o cargar la ficha del DNI ' + dniEditar);
          return;
        }

        const p = await res.json();

        if (p.operadora && document.getElementById('operadora')) {
          document.getElementById('operadora').value = p.operadora;
        }
        if (document.getElementById('apellido')) {
          document.getElementById('apellido').value = p.apellido || '';
        }
        if (document.getElementById('nombre')) {
          document.getElementById('nombre').value = p.nombre || '';
        }
        if (document.getElementById('dni')) {
          document.getElementById('dni').value = p.dni || dniEditar;
          document.getElementById('dni').readOnly = true;
        }
        if (document.getElementById('telefono')) {
          document.getElementById('telefono').value = p.telefono || '';
        }
        if (document.getElementById('direccion_referencia')) {
          document.getElementById('direccion_referencia').value = p.direccion_referencia || '';
        }
        if (document.getElementById('enfermedad_discapacidad')) {
          document.getElementById('enfermedad_discapacidad').value = p.enfermedad_discapacidad || '';
        }
        if (document.getElementById('medico_centro_salud')) {
          document.getElementById('medico_centro_salud').value = p.medico_centro_salud || '';
        }
        if (document.getElementById('medicacion')) {
          document.getElementById('medicacion').value = p.medicacion || '';
        }
        if (document.getElementById('otras_observaciones')) {
          document.getElementById('otras_observaciones').value = p.otras_observaciones || '';
        }
        if (document.getElementById('es_electrodependiente')) {
          document.getElementById('es_electrodependiente').checked = Boolean(p.es_electrodependiente);
        }
        if (p.criticidad && document.getElementById('criticidad')) {
          document.getElementById('criticidad').value = p.criticidad;
        }

        const latGuardada = Number(p.lat);
        const lngGuardada = Number(p.lng);
        if (Number.isFinite(latGuardada) && Number.isFinite(lngGuardada)) {
          map.setView([latGuardada, lngGuardada], 16);
          marker.setLatLng([latGuardada, lngGuardada]);
          actualizarCoords(latGuardada, lngGuardada);
        }

        const btnSubmit = document.querySelector('.btn-submit');
        if (btnSubmit) {
          btnSubmit.textContent = '💾 Guardar Cambios de la Ficha';
        }
      } catch (err) {
        alert('Error al cargar los datos para editar: ' + err.message);
      }
    });

    document.getElementById('formRiesgo').addEventListener('submit', async (e) => {
      e.preventDefault();

      const btnSubmit = document.querySelector('.btn-submit');
      const textoBtn = btnSubmit ? btnSubmit.textContent : 'Guardar';
      if (btnSubmit) {
        btnSubmit.disabled = true;
        btnSubmit.textContent = "⏳ Guardando ficha...";
      }

      const nombreOperadora = document.getElementById('operadora').value;
      if (nombreOperadora) {
        localStorage.setItem('nombre_operadora', nombreOperadora);
      }

      const latVal = parseFloat(document.getElementById('lat').value);
      const lngVal = parseFloat(document.getElementById('lng').value);

      const payload = {
        operadora: nombreOperadora,
        apellido: document.getElementById('apellido').value,
        nombre: document.getElementById('nombre').value,
        dni: document.getElementById('dni').value,
        telefono: document.getElementById('telefono').value,
        direccion_referencia: document.getElementById('direccion_referencia').value,
        enfermedad_discapacidad: document.getElementById('enfermedad_discapacidad').value,
        medico_centro_salud: document.getElementById('medico_centro_salud').value,
        medicacion: document.getElementById('medicacion').value,
        otras_observaciones: document.getElementById('otras_observaciones').value,
        es_electrodependiente: document.getElementById('es_electrodependiente').checked,
        criticidad: document.getElementById('criticidad').value,
        lat: Number.isFinite(latVal) ? latVal : defaultLat,
        lng: Number.isFinite(lngVal) ? lngVal : defaultLng
      };

      const controller = new AbortController();
      const timer = setTimeout(() => controller.abort(), 20000);

      try {
        const res = await fetch('/api/personas', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload),
          signal: controller.signal
        });
        clearTimeout(timer);

        if (res.ok) {
          const esEdicion = Boolean(new URLSearchParams(window.location.search).get('dni'));
          if (esEdicion) {
            alert('✅ Cambios guardados correctamente.');
            window.location.href = 'mapa.html';
            return;
          }

          alert('✅ Ficha guardada correctamente en el sistema.');
          document.getElementById('formRiesgo').reset();
          if (nombreOperadora) {
            document.getElementById('operadora').value = nombreOperadora;
          }
          marker.setLatLng([defaultLat, defaultLng]);
          map.setView([defaultLat, defaultLng], 13);
          actualizarCoords(defaultLat, defaultLng);
        } else {
          let errMsg = 'Error al guardar';
          try {
            const err = await res.json();
            errMsg = err.error || errMsg;
          } catch (_) {}
          alert('❌ Error: ' + errMsg);
        }
      } catch (error) {
        clearTimeout(timer);
        if (error.name === 'AbortError') {
          alert('❌ La conexión tardó demasiado. Revisa la señal del celular e intenta nuevamente.');
        } else {
          alert('❌ Error de red al guardar: ' + error.message);
        }
      } finally {
        if (btnSubmit) {
          btnSubmit.disabled = false;
          btnSubmit.textContent = textoBtn;
        }
      }
    });
  </script>
</body>
</html>
